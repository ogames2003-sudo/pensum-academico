<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión · Pensum</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f8fafc; color: #0f172a; text-align: center; }
      @media (prefers-color-scheme: dark) { body { background: #020617; color: #f1f5f9; } p { color: #94a3b8; } }
      img { width: 72px; height: 72px; border-radius: 50%; }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; }
      p { color: #64748b; margin: 0 0 20px; }
      a { display: inline-block; padding: 10px 18px; border-radius: 12px; background: #1c6ea4; color: #fff; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>El pensum necesita internet para mostrar tu progreso actualizado.</p>
      <!-- Enlace en lugar de onclick: la CSP del sitio no permite scripts en línea. -->
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
